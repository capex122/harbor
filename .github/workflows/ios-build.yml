name: iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - harbor-ios-exp
    paths:
      - .github/workflows/ios-build.yml
      - src/**
      - src-tauri/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm tauri ios init

      - name: Build unsigned iOS IPA
        run: pnpm tauri ios build --no-sign

      - name: Upload iOS build
        uses: actions/upload-artifact@v6
        with:
          name: harbor-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.xcarchive
          if-no-files-found: error
          retention-days: 14
