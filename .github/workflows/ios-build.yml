name: iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - harbor-ios-exp
    paths:
      - .github/workflows/ios-build.yml
      - src/**
      - src-tauri/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm tauri ios init

      - name: Configure VLCKit linker path
        working-directory: src-tauri/gen/apple
        run: |
          grep -q 'LIBRARY_SEARCH_PATHS\[arch=arm64\]:' project.yml
          awk '{ print; if ($0 ~ /LIBRARY_SEARCH_PATHS\[arch=arm64\]:/) print "        FRAMEWORK_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION)" }' project.yml > project.yml.tmp
          mv project.yml.tmp project.yml
          xcodegen generate
          xcodebuild -project harbor.xcodeproj -target harbor_iOS -configuration Release -showBuildSettings | grep 'FRAMEWORK_SEARCH_PATHS = .*Externals/arm64/Release'

      - name: Apply Harbor iOS icon
        run: pnpm tauri icon src-tauri/icons/icon.png --ios-color "#1a212c"

      - name: Build unsigned iOS IPA
        run: pnpm tauri ios build --no-sign

      - name: Upload iOS build
        uses: actions/upload-artifact@v6
        with:
          name: harbor-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.xcarchive
          if-no-files-found: error
          retention-days: 14
